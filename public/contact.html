<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type=""image/x-icon" href="./images/witcher_PNG28.png">
    <title>Contact</title>
    <meta name="author" content="Nic Nurge">
    <meta name="description" content="A page for contacting the developer">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div>Contact</div>





<form action="/mail" method="post">
    <ul>
        <li>
            <label for="name">Name:</label>
            <input type="text" id="name" name="user_name">
        </li>
        <li>
            <label for="email">Email:</label>
            <input type="email" id="email" name="user_email" required>
        </li>
        <li>
            <label for="message">Message:</label>
            <textarea id="message" name="user_message"></textarea>
        </li>
        <li class="button">
            <button id="contact-form-button" type="submit">Send you message</button>
        </li>
    </ul>
</form>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    <script type="module" src="./js/contact.js"></script>
</body>
</html>
